<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>音読チャレンジ</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <style>
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --text: #1d2433;
  --muted: #677086;
  --line: #e2e6ee;
  --primary: #1f6f8b;
  --primary-dark: #17566c;
  --primary-soft: #e3f1f6;
  --accent: #f08a24;
  --accent-soft: #fff1e3;
  --ok: #1a9b6c;
  --ok-soft: #e2f6ee;
  --ng: #d93a3a;
  --ng-soft: #fde8e8;
  --gold: #d4a017;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 14px rgba(20, 30, 60, .06);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  padding-bottom: env(safe-area-inset-bottom);
}
a { color: var(--primary); }
h1, h2, h3 { line-height: 1.35; margin: 0 0 .5em; }
h1 { font-size: 1.45rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75em; }
small, .muted { color: var(--muted); }
.hidden { display: none !important; }

/* ---- ヘッダー ---- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--primary); color: #fff;
}
.brand { display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; font-weight: 700; font-size: 1.1rem; }
.brand img { background: #fff; border-radius: 8px; }
.topbar-right { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.topbar-right button { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); }
.demo-banner { background: var(--accent-soft); color: #8a4a0b; text-align: center; font-size: .85rem; padding: 6px 12px; }

.container { max-width: 880px; margin: 0 auto; padding: 16px; }
.wide { max-width: 1100px; }

/* ---- カード ---- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
.card.tight { padding: 12px 14px; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-title h2 { margin: 0; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.grid.three { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 640px) { .grid.two, .grid.three { grid-template-columns: 1fr; } }

/* ---- ボタン ---- */
button, .btn {
  -webkit-appearance: none; appearance: none; font: inherit; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: #fff; color: var(--text); font-weight: 600; text-decoration: none; min-height: 44px;
}
button:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-danger { color: var(--ng); border-color: #f2c2c2; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--primary); }
.btn-small { padding: 6px 10px; min-height: 34px; font-size: .88rem; }
.btn-big { padding: 14px 22px; font-size: 1.1rem; min-height: 56px; border-radius: 14px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---- 入力 ---- */
label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: .95rem; }
input[type=text], input[type=password], input[type=number], input[type=date], select, textarea {
  width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text);
}
textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
.check { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 8px 0; }
.check input { width: 20px; height: 20px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }
.error { color: var(--ng); font-weight: 600; margin-top: 8px; }

/* ---- ログイン ---- */
.hero { text-align: center; padding: 18px 0 6px; }
.hero h1 { font-size: 1.7rem; }
.hero p { color: var(--muted); }
.login-card { max-width: 440px; margin: 0 auto 16px; }
.role-switch { display: flex; gap: 8px; margin-bottom: 8px; }
.role-switch button { flex: 1; }
.role-switch button.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark); }

/* ---- ホーム ---- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; text-align: center; }
.stat .v { font-size: 1.5rem; font-weight: 800; color: var(--primary-dark); line-height: 1.2; }
.stat .l { font-size: .8rem; color: var(--muted); }
.level-card { display: flex; align-items: center; gap: 16px; }
.level-badge {
  flex: none; width: 84px; height: 84px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 30% 30%, #fff6d8, #f6c94c); color: #6b4a00; font-weight: 800; font-size: 1.15rem;
  border: 3px solid #e8b52f;
}
.level-badge small { font-size: .65rem; color: #8a6a10; font-weight: 600; }
.level-info { flex: 1; }
.bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #f6c94c); border-radius: 99px; }

.proverb { background: linear-gradient(135deg, #e3f1f6, #fdf3e6); }
.proverb .en { font-size: 1.2rem; font-weight: 700; font-family: Georgia, "Times New Roman", serif; }
.proverb .ja { color: var(--muted); font-size: .9rem; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; text-decoration: none; color: inherit; }
.item:hover { background: #fafbfd; }
.item .main { flex: 1; min-width: 0; }
.item .title { font-weight: 700; }
.item .sub { font-size: .82rem; color: var(--muted); }
.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--primary-soft); color: var(--primary-dark); white-space: nowrap; }
.pill.contest { background: #fff3c9; color: #8a6200; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.todo { background: var(--ng-soft); color: var(--ng); }
.pill.gray { background: #eef0f4; color: var(--muted); }
.score-chip { font-weight: 800; font-size: 1.1rem; color: var(--primary-dark); min-width: 60px; text-align: right; }

/* ---- 練習画面 ---- */
.passage {
  font-family: Georgia, "Times New Roman", serif; font-size: 1.35rem; line-height: 2.0;
  background: #fff; border-radius: var(--radius); padding: 18px 20px; border: 1px solid var(--line);
  word-break: normal; overflow-wrap: anywhere;
}
.passage.small { font-size: 1.1rem; }
.passage.large { font-size: 1.7rem; }
.passage.blur .w:not(.ja) { filter: blur(6px); }
.passage .w.ja {
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: .72em; color: var(--muted); background: transparent; text-decoration: none;
}
.passage.hide-ja .w.ja { display: none; }
.passage .w { border-radius: 4px; padding: 0 1px; transition: background .2s; }
.passage .w.ok { color: var(--ok); }
.passage .w.ng { color: var(--ng); background: var(--ng-soft); text-decoration: underline wavy rgba(217,58,58,.5); text-underline-offset: 5px; }
.ja-text { color: var(--muted); font-size: .95rem; margin-top: 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.toolbar .sep { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.seg button { border: 0; border-radius: 0; min-height: 38px; padding: 6px 12px; font-size: .88rem; }
.seg button.active { background: var(--primary-soft); color: var(--primary-dark); }

.mic-dock {
  position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 16px;
  margin: 14px -18px -18px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.96); border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.mic-text { text-align: left; min-width: 0; }
.mic-btn {
  flex: none; width: 76px; height: 76px; border-radius: 50%; border: 0; font-size: 2rem; color: #fff;
  background: var(--accent); box-shadow: 0 6px 18px rgba(240,138,36,.4);
}
.mic-btn.rec { background: var(--ng); animation: pulse 1.2s infinite; box-shadow: 0 6px 18px rgba(217,58,58,.45); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(217,58,58,.5); } 70% { box-shadow: 0 0 0 18px rgba(217,58,58,0); } 100% { box-shadow: 0 0 0 0 rgba(217,58,58,0); } }
.mic-label { font-weight: 700; }
.live { min-height: 2.4em; color: var(--muted); font-size: .95rem; background: #fafbfd; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; margin-top: 10px; text-align: left; }
.timer { font-variant-numeric: tabular-nums; color: var(--muted); }

.result { text-align: center; }
.result .big { font-size: 3.2rem; font-weight: 900; line-height: 1; }
.result .big.good { color: var(--ok); }
.result .big.mid { color: var(--accent); }
.result .big.low { color: var(--ng); }
.result .detail { color: var(--muted); }
.ring { width: 150px; height: 150px; margin: 6px auto; position: relative; }
.ring svg { transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.celebrate { background: #fff7d6; border: 1px solid #f2d36b; color: #7a5a00; border-radius: 12px; padding: 10px 12px; font-weight: 700; margin: 10px 0; }

/* ---- ランキング ---- */
.rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-top: 1px solid var(--line); }
.rank-row:first-child { border-top: 0; }
.rank-row.me { background: var(--accent-soft); border-radius: 10px; }
.rank-no { width: 40px; text-align: center; font-weight: 900; font-size: 1.1rem; color: var(--muted); }
.rank-no.r1 { color: #c99400; } .rank-no.r2 { color: #8a96a8; } .rank-no.r3 { color: #b0703a; }
.rank-name { flex: 1; font-weight: 600; }
.rank-val { font-weight: 800; color: var(--primary-dark); }

/* ---- 棒グラフ（14日） ---- */
.chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 8px 0 0; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.chart .b { width: 100%; max-width: 26px; background: var(--primary); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.chart .b.zero { background: var(--line); }
.chart .d { font-size: .65rem; color: var(--muted); margin-top: 3px; }

/* ---- 表 ---- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { background: #f7f8fb; font-size: .82rem; color: var(--muted); position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #fafbfd; }
.cell-good { color: var(--ok); font-weight: 700; }
.cell-mid { color: var(--accent); font-weight: 700; }
.cell-low { color: var(--ng); font-weight: 700; }
.cell-none { color: #b5bccb; }

/* ---- タブ ---- */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 700; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tabs a.active { color: var(--primary-dark); border-color: var(--primary); }

/* ---- 下部ナビ（生徒） ---- */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #fff; border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; padding: 4px 0 calc(4px + env(safe-area-inset-bottom));
}
.bottom-nav a { flex: 1; text-align: center; text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 700; padding: 4px 0; }
.bottom-nav a .ic { display: block; font-size: 1.35rem; line-height: 1.2; }
.bottom-nav a.active { color: var(--primary); }
body.has-nav main { padding-bottom: 90px; }

/* ---- トースト ---- */
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50;
  background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); max-width: 90vw; font-size: .95rem;
}
.toast.err { background: var(--ng); }

.loading { text-align: center; color: var(--muted); padding: 40px 0; }
.spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.notice { background: var(--primary-soft); color: var(--primary-dark); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.notice.warn { background: var(--accent-soft); color: #8a4a0b; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
.back { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-weight: 700; margin-bottom: 10px; }
.kpi-inline { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
.kpi-inline b { color: var(--text); font-size: 1.05rem; }
.passes { width: 100%; }
@media print {
  .topbar, .bottom-nav, .demo-banner, .no-print, .tabs { display: none !important; }
  body { background: #fff; }
  .card { box-shadow: none; border: 1px solid #ccc; }
  .pass-slip { page-break-inside: avoid; }
}
.pass-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pass-slip { border: 1px dashed #aab; border-radius: 8px; padding: 10px; font-size: .9rem; }
.pass-slip b { font-size: 1.1rem; }
.ring .big { font-size: 2.3rem; letter-spacing: -.02em; }

/* 日本語（上）＋英語（下）の組 */
.passage .pair { margin-bottom: .55em; }
.passage .pair:last-child { margin-bottom: 0; }
.passage .line.ja-line { line-height: 1.5; margin-bottom: .05em; }
.passage .line.ja-line .w.ja { font-size: .72em; }
.passage.hide-ja .line.ja-line { display: none; }
.passage .gap { height: .8em; }

/* ---- 合言葉・不正防止 ---- */
.passage .w.phrase { font-family: system-ui, sans-serif; font-weight: 800; font-size: .85em; background: #fff3c9; color: #7a5600; border: 1px solid #f0cf63; border-radius: 6px; padding: 1px 6px; text-decoration: none; }
.passage .w.phrase.ok { background: var(--ok-soft); color: var(--ok); border-color: #9fdcc4; }
.passage .w.phrase.ng { background: var(--ng-soft); color: var(--ng); border-color: #f2b5b5; }
.passage .w.phrase-label { font-size: .9em; }
.phrase-note { background: #fff3c9; border: 1px solid #f0cf63; color: #6b4a00; border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: .95rem; }
.rec-note { color: var(--muted); font-size: .82rem; margin-top: 8px; }
.cheat-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(110, 0, 0, .6); display: flex; align-items: center; justify-content: center; padding: 16px; }
.cheat-box { background: #fff; border: 5px solid var(--ng); border-radius: 18px; max-width: 540px; width: 100%; padding: 24px 22px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.35); animation: shake .45s; }
.cheat-icon { font-size: 4rem; line-height: 1; }
.cheat-box h2 { color: var(--ng); font-size: 1.6rem; margin: 10px 0; }
.cheat-box p { font-size: 1rem; line-height: 1.8; }
.cheat-box button { background: var(--ng); border-color: var(--ng); color: #fff; margin-top: 8px; }
.cheat-inline { color: var(--ng); font-weight: 800; font-size: 1.1rem; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.pill.flag { background: var(--ng-soft); color: var(--ng); }

/* ---- 要確認（不正の疑い）---- */
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 99px; background: var(--ng); color: #fff; font-size: .75rem; font-weight: 800; line-height: 20px; text-align: center; vertical-align: middle; }
.bell { color: #fff; text-decoration: none; font-size: 1.1rem; display: inline-flex; align-items: center; }
.flag-banner { display: block; background: var(--ng-soft); color: var(--ng); border: 2px solid #f2b5b5; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-weight: 700; text-decoration: none; animation: pulseBg 2s infinite; }
@keyframes pulseBg { 0%,100% { background: var(--ng-soft); } 50% { background: #fbd3d3; } }
.flag-card { border-left: 6px solid var(--ng); }
.flag-card.done { border-left-color: var(--ok); opacity: .8; }
.flag-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.flag-body { margin-bottom: 6px; }
.flag-transcript { background: #fafbfd; border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; font-size: .9rem; }
.audio-player { max-width: 260px; height: 40px; }

.pending-card { border: 2px solid #f0cf63; background: #fffbea; }
.pending-title { font-size: 1.3rem; font-weight: 800; color: #7a5600; margin-bottom: 6px; }

/* ---- 音読の種類・マスターモード ---- */
.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 10px; }
.step { display: inline-flex; flex-direction: column; align-items: center; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--text); font-weight: 700; font-size: .9rem; background: #fff; }
.step small { font-weight: 600; color: var(--muted); font-size: .75rem; }
.step.cur { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); }
.step.ok { border-color: #9fdcc4; }
.step.locked { color: #aab; background: #f3f4f7; }
.step-arrow { color: var(--muted); }
.master-head { background: linear-gradient(90deg, #fff6d8, #e3f1f6); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: .92rem; }
.mode-note { background: var(--primary-soft); color: var(--primary-dark); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-size: .92rem; font-weight: 600; }
.pill.master { background: #ede7ff; color: #5b3fb5; }
.pass-line { margin: 8px 0; font-weight: 700; color: var(--accent); }
.pass-line.ok { color: var(--ok); }
.master-win { font-size: 1.15rem; }
.passage .w.blank { color: var(--primary); font-family: system-ui, sans-serif; letter-spacing: .1em; }
.passage .w.was-blank { border-bottom: 2px dotted currentColor; }
.passage.mode-trans .line:not(.ja-line) .w:not(.phrase):not(.phrase-label) { display: none; }
.passage.mode-trans .line.ja-line .w.ja { font-size: 1em; color: var(--text); }
.passage.mode-trans .pair { margin-bottom: .3em; }
.ja-box { background: #fafbfd; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 8px; font-size: 1.1rem; line-height: 1.9; }
.type-box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 14px; background: #fcfcfe; }
.type-box h3 { margin: 0 0 4px; }
.blank-editor { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; line-height: 2.1; font-family: Georgia, serif; font-size: 1.05rem; }
.blank-editor .bw { cursor: pointer; border-radius: 4px; padding: 1px 2px; }

    if (!a || !assignmentVisibleTo(a, s)) throw err('この課題は見つかりません。');
    var b = store.getBest(s.id, a.id);
    var pg = progress(store, s.id, a);
    return {
      assignment: { id: a.id, title: a.title, text: a.text, ja: str(a.ja), due: str(a.due), contest: bool(a.contest),
        types: pg.types, mode: isMaster(a) ? 'master' : 'normal', pass: pg.pass, blanks: str(a.blanks) },
      best: b ? num(b.best) : null, attempts: pg.attempts, progress: pg
    };
  };

  handlers.submit = function (p, store, ctx) {
    var s = currentStudent(p, store, ctx);
    var now = ctx.now(), today = jstDate(now);
    var text, aid = str(p.aid), kind, type = 1, a = null;
    if (aid) {
      a = store.getAssignment(aid);
      if (!a || !assignmentVisibleTo(a, s)) throw err('この課題は見つかりません。');
      type = num(p.type) || 1;
      if (aTypes(a).indexOf(type) < 0) throw err('この課題では、その音読の種類は選べません。');
      text = a.text; kind = (bool(a.contest) ? '大会' : '課題') + (type > 1 ? '（' + TYPE_NAME[type] + '）' : '');
    } else {
      text = str(p.text).slice(0, 3000);
      if (!text) throw err('英文がありません。');
      kind = p.kind === 'proverb' ? 'ことわざ' : '自主練';
    }
    var transcript = str(p.transcript).slice(0, 6000);
    var cfg = settingsForClient(store);
    var hasPhrase = !!str(p.phrase);
    var r = hasPhrase ? Sc.scoreWithPhrase(text, transcript, str(p.phrase).slice(0, 60), num(p.phraseAt)) : Sc.score(text, transcript);
    var dur = Math.max(0, Math.min(3600, num(p.duration)));

    // 不正防止：お手本音声の検知、合言葉の確認
    var flag = (p.flag === 'tts' || p.flag === 'phrase') ? p.flag : '';
    if (!flag && cfg.phraseCheck) {
      if (!hasPhrase || !r.phrase || r.phrase.matched === 0) flag = 'phrase';   // 合言葉がまったくない → 録音などの可能性が高い
      // 合言葉は1語でも聞き取れれば合格（scoring.js）。'partial' は旧版との互換のために残しています
      else if (!r.phrase.ok) flag = 'partial';
    }
    // 1秒に4語を超える速さ（15語以上）は、人の音読としては不自然 → 先生が確認
    if (!flag && r.correct >= 15 && dur > 0 && r.correct / dur > 4) flag = 'speed';

    // 音声の保存（先生が確認できるように）
    var audioId = '';
    if (cfg.saveAudio && p.audio && p.audio.b64 && store.saveAudio && String(p.audio.b64).length < 4000000) {
      try {
        audioId = store.saveAudio({ mime: str(p.audio.mime).slice(0, 60) || 'audio/webm', b64: String(p.audio.b64),
          name: s.id + '_' + now.toISOString().replace(/[:.]/g, '-') });
      } catch (e) { audioId = ''; }
    }

    if (flag) {
      // 記録には残すが、単語数・自己ベストには加えない
      store.appendRecord({
        time: now.toISOString(), date: today, sid: s.id, aid: aid, type: type, kind: kind, flag: FLAGS[flag].label,
        reviewed: FLAGS[flag].definite ? AUTO_INVALID : '',
        accuracy: r.accuracy, correct: 0, total: r.total, duration: dur, audio: audioId,
        transcript: transcript.slice(0, 1000), text: aid ? '' : text.slice(0, 300)
      });
      return { flagged: flag, definite: FLAGS[flag].definite, result: r, student: studentPublic(s) };
    }

    // 生徒の累計を更新
    var before = levelOf(num(s.totalWords));
    var upd = {};
    upd.totalWords = num(s.totalWords) + r.correct;
    if (r.correct > 0) {
      if (str(s.lastDate) === today) upd.streak = num(s.streak) || 1;
      else if (str(s.lastDate) === addDays(today, -1)) upd.streak = num(s.streak) + 1;
      else upd.streak = 1;
      upd.lastDate = today;
      upd.bestStreak = Math.max(num(s.bestStreak), upd.streak);
    }
    upd.todayWords = (str(s.todayDate) === today ? num(s.todayWords) : 0) + r.correct;
    upd.todayDate = today;
    store.updateStudent(s.id, upd);
    for (var k in upd) s[k] = upd[k];
    var after = levelOf(num(s.totalWords));

    var newBest = false, before2 = a ? progress(store, s.id, a) : null;
    if (aid) {
      var bk = bestKey(aid, type);
      var b = store.getBest(s.id, bk);
      if (!b || r.accuracy > num(b.best)) newBest = true;
      store.setBest(s.id, bk, {
        best: b ? Math.max(num(b.best), r.accuracy) : r.accuracy,
        attempts: (b ? num(b.attempts) : 0) + 1,
        last: now.toISOString(),
        bestAt: newBest ? now.toISOString() : (b ? b.bestAt : now.toISOString())
      });
    }
    store.appendRecord({
      time: now.toISOString(), date: today, sid: s.id, aid: aid, type: type, kind: kind,
      accuracy: r.accuracy, correct: r.correct, total: r.total, duration: dur, audio: audioId, flag: '',
      transcript: transcript.slice(0, 1000), text: aid ? '' : text.slice(0, 300)
    });
    var after2 = a ? progress(store, s.id, a) : null;
    return {
      progress: after2, masterNew: !!(after2 && after2.masterCleared && !before2.masterCleared),
      passed: a ? r.accuracy >= passLine(a) : null,
      result: r, student: studentPublic(s), newBest: newBest,
      levelUp: after.index > before.index ? after.name : null
    };
  };

  handlers.ranking = function (p, store, ctx) {
    var s = currentStudent(p, store, ctx);
    if (!bool(store.getSetting('ランキングを表示'))) throw err('ランキングは先生が非表示にしています。');
    var allowNick = bool(store.getSetting('ニックネームを使う'));
    var today = jstDate(ctx.now());
    var period = p.period === 'week' || p.period === 'month' ? p.period : 'total';
    var scope = p.scope === 'all' ? 'all' : 'class';
    var students = store.getStudents().filter(function (x) { return scope === 'all' || x.cls === s.cls; });
    var score = {};
    if (period === 'total') {
      students.forEach(function (x) { score[x.id] = num(x.totalWords); });
    } else {
      var since = period === 'week' ? weekStart(today) : monthStart(today);
      store.getRecordsSince(since).forEach(function (r) { score[r.sid] = (score[r.sid] || 0) + num(r.correct); });
    }
    var list = students.map(function (x) {
      return { id: x.id, name: displayName(x, allowNick), words: score[x.id] || 0, level: levelOf(num(x.totalWords)).name };
    }).sort(function (a, b) { return b.words - a.words; });
    var rank = 0, prev = -1, mine = null;
    list.forEach(function (x, i) {
      if (x.words !== prev) { rank = i + 1; prev = x.words; }
      x.rank = rank;
      x.me = x.id === s.id;
      if (x.me) mine = { rank: x.rank, words: x.words };
    });
    var top = list.slice(0, 30).map(function (x) { return { rank: x.rank, name: x.name, words: x.words, level: x.level, me: x.me }; });
    return { list: top, mine: mine, count: list.length, period: period, scope: scope };
  };

  handlers.contest = function (p, store, ctx) {
    var s = currentStudent(p, store, ctx);
    var a = store.getAssignment(str(p.aid));
    if (!a || !assignmentVisibleTo(a, s) || !bool(a.contest)) throw err('この大会は見つかりません。');
    var allowNick = bool(store.getSetting('ニックネームを使う'));
    var byId = {};
    store.getStudents().forEach(function (x) { byId[x.id] = x; });
    var list = store.getBestsByAssignment(a.id).filter(function (b) { return byId[b.sid]; })
      .map(function (b) { return { sid: b.sid, name: displayName(byId[b.sid], allowNick), best: num(b.best), at: str(b.bestAt) }; })
      .sort(function (x, y) { return y.best - x.best || x.at.localeCompare(y.at); });
    var mine = null;
    list.forEach(function (x, i) {
      x.rank = (i > 0 && list[i - 1].best === x.best) ? list[i - 1].rank : i + 1;
      x.me = x.sid === s.id;
      if (x.me) mine = { rank: x.rank, best: x.best };
    });
    return {
      title: a.title, due: str(a.due), mine: mine, count: list.length,
      list: list.slice(0, 30).map(function (x) { return { rank: x.rank, name: x.name, best: x.best, me: x.me }; })
    };
  };

  handlers.history = function (p, store, ctx) {
    var s = currentStudent(p, store, ctx);
    var titles = {};
    store.getAssignments().forEach(function (a) { titles[a.id] = a.title; });
    var recs = store.getRecordsByStudent(s.id, 50).map(function (r) {
      return {
        time: r.time, date: r.date, kind: r.kind, title: r.aid ? (titles[r.aid] || '（削除された課題）') : (Sc.englishOnly(r.text).replace(/\n/g, ' ') || str(r.text)).slice(0, 40),
        accuracy: num(r.accuracy), correct: num(r.correct), total: num(r.total)
      };
    });
    // 直近14日の単語数
    var today = jstDate(ctx.now()), days = [];
    var map = {};
    store.getRecordsByStudent(s.id, 2000).forEach(function (r) {
      if (r.date >= addDays(today, -13)) map[r.date] = (map[r.date] || 0) + num(r.correct);
    });
    for (var i = 13; i >= 0; i--) { var d = addDays(today, -i); days.push({ date: d, words: map[d] || 0 }); }
    return { records: recs, days: days };
  };

  // ---------------- 先生用 ----------------
  // ログイン中の先生（毎回、名簿で有効かを確認）
  function currentTeacher(p, store, ctx) {
    var tk = readToken(ctx, p.token, 'teacher');
    var t = store.getTeacher(tk.id);
    if (!t || !teacherPublic(t).active) throw err('ログインしてください。（アカウントが無効になっています）');
    return teacherPublic(t);
  }
  function adminOnly(me) { if (!me.admin) throw err('この操作は管理者だけができます。'); }

  handlers.t_overview = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    var today = jstDate(ctx.now());
    var students = store.getStudents();
    var bests = store.getAllBests();
    var tname = {};
    store.getTeachers().forEach(function (t) { tname[t.id] = str(t.name); });
    var assignments = store.getAssignments().map(function (a) {
      var cl = splitClasses(a.classes);
      var targets = students.filter(function (s) { return !cl.length || cl.indexOf('全員') >= 0 || cl.indexOf(s.cls) >= 0; });
      var tset = {};
      targets.forEach(function (s) { tset[s.id] = true; });
      var done = 0, sum = 0;
      bests.forEach(function (b) { if (b.aid === a.id && tset[b.sid]) { done++; sum += num(b.best); } });
      if (isMaster(a)) done = targets.filter(function (s) { return progress(store, s.id, a).masterCleared; }).length;
      return {
        id: a.id, title: a.title, classes: str(a.classes), due: str(a.due), contest: bool(a.contest),
        published: bool(a.published), created: str(a.created), words: num(a.words),
        types: aTypes(a), mode: isMaster(a) ? 'master' : 'normal',
        owner: str(a.owner), ownerName: tname[str(a.owner)] || '', canEdit: canEditAssignment(me, a),
        mine: str(a.owner) === me.id || splitClasses(a.classes).some(function (c) { return me.classes.indexOf(c) >= 0; }),
        targets: targets.length, done: done, avg: done ? Math.round(sum / done * 10) / 10 : null
      };
    }).sort(function (x, y) { return (y.created || '').localeCompare(x.created || ''); });
    var weekSince = weekStart(today);
    var week = {}, flags = {};
    store.getRecordsSince(weekSince).forEach(function (r) {
      week[r.sid] = (week[r.sid] || 0) + num(r.correct);
      if (str(r.flag)) flags[r.sid] = (flags[r.sid] || 0) + 1;
    });
    var list = students.map(function (s) {
      var pub = studentPublic(s);
      pub.name = str(s.name);
      pub.weekWords = week[s.id] || 0;
      pub.weekFlags = flags[s.id] || 0;
      if (pub.lastDate && pub.lastDate < addDays(today, -1)) pub.streak = 0;
      return pub;
    });
    var settings = settingsForClient(store);
    return { assignments: assignments, students: list, classes: classList(store).map(function (c) { return c.name; }), today: today, settings: settings,
      openFlags: openFlags(store, today), me: me };
  };

  handlers.t_getAssignment = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    var a = store.getAssignment(str(p.aid));
    if (!a) throw err('課題が見つかりません。');
    return { assignment: {
      id: a.id, title: a.title, text: a.text, ja: str(a.ja), classes: str(a.classes),
      due: str(a.due), contest: bool(a.contest), published: bool(a.published),
      types: aTypes(a), mode: isMaster(a) ? 'master' : 'normal', pass: passLine(a), blanks: str(a.blanks),
      canEdit: canEditAssignment(me, a)
    } };

  handlers.t_saveAssignment = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    var a = p.assignment || {};
    var title = str(a.title).slice(0, 80), text = str(a.text).slice(0, 5000);
    if (!title) throw err('タイトルを入力してください。');
    if (!text) throw err('英文を入力してください。');
    var data = {
      title: title, text: text, ja: str(a.ja).slice(0, 5000), classes: splitClasses(a.classes).join(','),
      due: str(a.due).slice(0, 10), contest: !!a.contest, published: a.published !== false,
      words: Sc.countWords(text)
    };
    var types = aTypes({ types: [].concat(a.types || [1]).join(',') });
    data.mode = a.mode === 'master' ? 'master' : 'normal';
    var hasJa = Sc.tokenize(text).some(function (t) { return t.ja; }) || !!data.ja;
    if (!hasJa && types.some(function (t) { return NEED_JA.indexOf(t) >= 0; })) {
      throw err('「並べ替え」と「日本語→英語」には日本語が必要です。英文に日本語の行を入れるか、和訳を入力してください。');
    }
    data.types = types.join(',');
    data.pass = Math.max(1, Math.min(100, Math.round(num(a.pass) || 80)));
    data.blanks = str(a.blanks).replace(/[^\d,]/g, '').slice(0, 3000);
    // 権限：担当クラスにだけ出せる（全員向けは管理者のみ）
    var cls = splitClasses(data.classes);
    if (!me.admin) {
      if (!cls.length) throw err('対象クラスを選んでください（全員向けの課題は管理者だけが出せます）。');
      var bad = cls.filter(function (c) { return me.classes.indexOf(c) < 0; });
      if (bad.length) throw err('担当していないクラスには課題を出せません：' + bad.join('、'));
    }
    if (a.id && store.getAssignment(a.id)) {
      if (!canEditAssignment(me, store.getAssignment(a.id))) throw err('この課題を編集する権限がありません。');
      store.updateAssignment(a.id, data);
      return { id: a.id };
    }
    data.owner = me.id;
    do { data.id = 'A' + ctx.now().getTime().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase(); }
    while (store.getAssignment(data.id));
    data.created = ctx.now().toISOString();
    store.addAssignment(data);
    return { id: data.id };
  };

  handlers.t_deleteAssignment = function (p, store, ctx) {

  handlers.t_assignmentResults = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    var a = store.getAssignment(str(p.aid));
    if (!a) throw err('課題が見つかりません。');
    var cl = splitClasses(a.classes);
    var types = aTypes(a), pl = passLine(a);
    var bests = {};
    types.forEach(function (t) {
      store.getBestsByAssignment(bestKey(a.id, t)).forEach(function (b) { (bests[b.sid] = bests[b.sid] || {})[t] = b; });
    });
    var rows = store.getStudents().filter(function (s) {
      return !cl.length || cl.indexOf('全員') >= 0 || cl.indexOf(s.cls) >= 0 || bests[s.id];
    }).map(function (s) {
      var bb = bests[s.id] || {}, b = bb[1], last = '', att = 0, per = {}, cleared = 0;
      types.forEach(function (t) {
        var x = bb[t];
        per[t] = x ? num(x.best) : null;
        if (x) { att += num(x.attempts); if (str(x.last) > last) last = str(x.last); if (num(x.best) >= pl) cleared++; }
      });
      return { id: s.id, cls: s.cls, no: s.no, name: str(s.name), bests: per,
        best: b ? num(b.best) : null, attempts: att, last: last,
        masterCleared: isMaster(a) && cleared === types.length };
    });
    return { assignment: { id: a.id, title: a.title, text: a.text, due: str(a.due), contest: bool(a.contest), classes: str(a.classes),
      types: types, mode: isMaster(a) ? 'master' : 'normal', pass: pl, canEdit: canEditAssignment(me, a) }, rows: rows };
  };

  handlers.t_export = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    var cls = str(p.cls);
    var assignments = store.getAssignments().slice().sort(function (x, y) { return (x.created || '').localeCompare(y.created || ''); });
    var bests = {};
    store.getAllBests().forEach(function (b) { bests[b.sid + '|' + b.aid] = b; });
    var header = ['クラス', '番号', '名前', '累計単語数', '級・段', '連続日数', '最終音読日'];
    assignments.forEach(function (a) {
      aTypes(a).forEach(function (t) { header.push(a.title + (t > 1 ? '・' + TYPE_NAME[t] : '') + '（最高%）'); });
      header.push(a.title + '（回数）');
      if (isMaster(a)) header.push(a.title + '（マスター）');
    });
    var rows = [header];
    store.getStudents().filter(function (s) { return !cls || s.cls === cls; })
      .sort(function (x, y) { return x.cls.localeCompare(y.cls) || num(x.no) - num(y.no); })
      .forEach(function (s) {
        var row = [s.cls, num(s.no), str(s.name), num(s.totalWords), levelOf(num(s.totalWords)).name, num(s.streak), str(s.lastDate)];
        assignments.forEach(function (a) {
          var att = 0, cleared = 0, types = aTypes(a);
          types.forEach(function (t) {
            var b = bests[s.id + '|' + bestKey(a.id, t)];
            row.push(b ? num(b.best) : '');
            if (b) { att += num(b.attempts); if (num(b.best) >= passLine(a)) cleared++; }
          });
          row.push(att || '');
          if (isMaster(a)) row.push(cleared === types.length ? '達成' : cleared + '/' + types.length);

        rows.push(row);

  // ---- 自分のパスワード変更 ----
  handlers.t_changePassword = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    var t = store.getTeacher(me.id);
    if (!passMatches(t, str(p.oldPass))) throw err('今のパスワードがちがいます。');

    store.updateTeacher(me.id, { pass: hashPass(me.id, str(p.newPass)) });

  // ---- 管理者：先生のアカウント ----
  handlers.t_teachers = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    adminOnly(me);
    return { teachers: store.getTeachers().map(teacherPublic), classes: classList(store).map(function (c) { return c.name; }) };
  };
  handlers.t_saveTeacher = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    adminOnly(me);
    var t = p.teacher || {};
    var id = str(t.id).toLowerCase();
    if (!/^[a-z0-9._-]{3,20}$/.test(id)) throw err('ログインIDは、半角英数字（3〜20文字）にしてください。');
    var name = str(t.name).slice(0, 30);
    if (!name) throw err('名前を入力してください。');
    var data = { name: name, role: t.role === 'admin' ? 'admin' : 'teacher', classes: splitClasses(t.classes).join(','),
      active: t.active !== false };
    var ex = store.getTeacher(id);
    if (t.isNew) {
      if (ex) throw err('そのログインIDはすでに使われています。');
      var pw = randomPass();
      data.id = id; data.pass = hashPass(id, pw); data.created = ctx.now().toISOString();
      store.addTeacher(data);
      return { id: id, password: pw };
    }
    if (!ex) throw err('先生が見つかりません。');
    // 管理者が1人もいなくならないようにする
    var admins = store.getTeachers().filter(function (x) { var tp = teacherPublic(x); return tp.admin && tp.active && x.id !== id; });
    if ((data.role !== 'admin' || !data.active) && teacherPublic(ex).admin && !admins.length) throw err('管理者が1人もいなくなるため、変更できません。');
    store.updateTeacher(id, data);
    return { id: id };

    return { id: id, password: pw };
  };
  handlers.t_deleteTeacher = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    adminOnly(me);
    var id = str(p.id).toLowerCase();
    if (id === me.id) throw err('自分のアカウントは削除できません。');
    var ex = store.getTeacher(id);
    if (!ex) throw err('先生が見つかりません。');
    store.deleteTeacher(id);
    return {};
  };

  // ---- 管理者：クラスと人数 ----
  handlers.t_classes = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    var teachers = store.getTeachers().map(teacherPublic);
    return { classes: classList(store).map(function (c) {
      c.teachers = teachers.filter(function (t) { return t.active && t.classes.indexOf(c.name) >= 0; }).map(function (t) { return t.name; });
      return c;
    }), admin: me.admin };
  };
  // 人数を設定：増やすと生徒（番号・パスコード）を自動で追加、減らすと番号の大きい生徒を削除（confirm が必要）
  handlers.t_saveClass = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    adminOnly(me);
    var name = str(p.name).replace(/\s/g, '').slice(0, 12);
    if (!name || /[,、]/.test(name)) throw err('クラス名を正しく入力してください（例：1A、1-1）。');
    var count = Math.round(num(p.count));
    if (count < 0 || count > 60) throw err('人数は0〜60人にしてください。');
    var students = store.getStudents().filter(function (s) { return s.cls === name; });
    var removing = students.filter(function (s) { return num(s.no) > count; });
    if (removing.length && !p.confirm) {
      return { needConfirm: true, removing: removing.map(function (s) { return s.cls + ' ' + s.no + '番 ' + str(s.name); }) };
    }
    removing.forEach(function (s) { store.deleteStudent(s.id); });
    var added = 0;
    for (var i = 1; i <= count; i++) {
      var sid = name + '-' + i;
      if (!store.getStudent(sid)) {
        store.addStudent({ id: sid, cls: name, no: String(i), name: '', pass: String(1000 + Math.floor(Math.random() * 9000)), nick: '',
          totalWords: 0, streak: 0, bestStreak: 0, lastDate: '', todayDate: '', todayWords: 0 });
        added++;
      }
    }
    store.setClass(name, count);
    return { added: added, removed: removing.length };
  };
  handlers.t_deleteClass = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    adminOnly(me);
    var name = str(p.name);
    var students = store.getStudents().filter(function (s) { return s.cls === name; });
    if (students.length && !p.confirm) return { needConfirm: true, removing: students.map(function (s) { return s.cls + ' ' + s.no + '番 ' + str(s.name); }) };
    students.forEach(function (s) { store.deleteStudent(s.id); });
    store.deleteClass(name);
    store.getTeachers().forEach(function (t) {
      var cl = splitClasses(t.classes);
      if (cl.indexOf(name) >= 0) store.updateTeacher(t.id, { classes: cl.filter(function (c) { return c !== name; }).join(',') });
    });
    return { removed: students.length };
  };
  handlers.t_me = function (p, store, ctx) {
    return { me: currentTeacher(p, store, ctx) };
  };

  // ---- 不正の疑い（要確認）----
  var FLAG_DAYS = 90;
  function rid(r) { return str(r.time) + '|' + str(r.sid); }
  function openFlags(store, today) {
    var n = 0;
    store.getFlaggedRecords(addDays(today, -FLAG_DAYS)).forEach(function (r) { if (!str(r.reviewed)) n++; });
    return n;
  }
  handlers.t_flagCount = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    return { count: openFlags(store, jstDate(ctx.now())) };
  };
  handlers.t_flags = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    var today = jstDate(ctx.now());
    var byId = {}, titles = {};
    store.getStudents().forEach(function (s) { byId[s.id] = s; });
    store.getAssignments().forEach(function (a) { titles[a.id] = a.title; });
    var list = store.getFlaggedRecords(addDays(today, -FLAG_DAYS))
      .filter(function (r) { return p.all || !str(r.reviewed); })
      .slice(0, 200)
      .map(function (r) {
        var s = byId[r.sid] || { cls: '', no: '', name: '' };
        return { rid: rid(r), time: r.time, sid: r.sid, cls: s.cls, no: s.no, name: str(s.name), kind: r.kind,
          title: r.aid ? (titles[r.aid] || '（削除された課題）') : (Sc.englishOnly(r.text).replace(/\n/g, ' ') || str(r.text)).slice(0, 60),
          flag: str(r.flag), reviewed: str(r.reviewed), audio: str(r.audio), transcript: str(r.transcript),
          accuracy: num(r.accuracy), total: num(r.total), canReview: canTeach(me, s.cls) };
      });
    return { list: list, open: openFlags(store, today) };
  };
  // 先生が確認：ok＝問題なし（記録を認めて単語数を加える）／ng＝不正あり
  handlers.t_reviewFlag = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    var r = store.findRecord(str(p.rid));
    if (!r || !str(r.flag)) throw err('記録が見つかりません。');
    var rs = store.getStudent(r.sid);
    if (rs && !canTeach(me, rs.cls)) throw err('担当していないクラスの生徒は確認できません。');
    if (str(r.reviewed)) return { reviewed: r.reviewed };  // 自動で無効になったもの・確認済みのものは変更しない
    var day = jstDate(ctx.now());
    var ok = p.verdict === 'ok';
    var label = (ok ? '問題なし' : '不正あり') + '（' + day + '）';
    var upd = { reviewed: label };
    if (ok) {
      var credit = Math.round(num(r.accuracy) * num(r.total) / 100);
      upd.correct = credit;
      var s = store.getStudent(r.sid);
      if (s && credit) store.updateStudent(s.id, { totalWords: num(s.totalWords) + credit });
      if (r.aid) {
        var rk = bestKey(r.aid, num(r.type) || 1);
        var b = store.getBest(r.sid, rk);
        var better = !b || num(r.accuracy) > num(b.best);
        store.setBest(r.sid, rk, {
          best: b ? Math.max(num(b.best), num(r.accuracy)) : num(r.accuracy),
          attempts: (b ? num(b.attempts) : 0) + 1, last: r.time,
          bestAt: better ? r.time : (b ? b.bestAt : r.time)
        });
      }
    }
    store.updateRecord(str(p.rid), upd);
    return { reviewed: label };
  };

  handlers.t_audio = function (p, store, ctx) {
    var me = currentTeacher(p, store, ctx);
    if (!store.getAudio) throw err('音声を読み込めません。');
    var a = store.getAudio(str(p.id));
    if (!a) throw err('音声が見つかりません（削除されたか、デモモードで前回のページ表示より前の録音です）。');
    return { mime: a.mime, b64: a.b64 };
  };

  var WRITE_ACTIONS = { submit: 1, setNick: 1, t_saveAssignment: 1, t_deleteAssignment: 1,
    t_importStudents: 1, t_saveSettings: 1, t_reviewFlag: 1, t_changePassword: 1, t_saveTeacher: 1,
    t_resetTeacherPass: 1, t_deleteTeacher: 1, t_saveClass: 1, t_deleteClass: 1, teacherLogin: 1 };

  function handle(action, payload, store, ctx) {
    var fn = handlers[action];
    if (!fn) return { ok: false, error: '不明な操作です：' + action };
    try {
      var res = fn(payload || {}, store, ctx);
      res.ok = true;
      return res;
    } catch (e) {
      return { ok: false, error: e.userMessage || ('エラーが発生しました：' + (e && e.message)) };
    }
  }

  var api = { handle: handle, sha256: sha256, hashPass: hashPass, levelOf: levelOf, LEVELS: LEVELS, jstDate: jstDate, addDays: addDays,
    weekStart: weekStart, WRITE_ACTIONS: WRITE_ACTIONS };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Core = api;

/*
 * デモモード用の保存先（端末の中に保存）
 * Apps Script 版の保存先（スプレッドシート）と同じ使い方ができるようにしたものです。
 */
(function (root) {
  'use strict';

  function MemStore(data, onChange) {
    this.d = data;
    this.d.students = this.d.students || [];
    this.d.assignments = this.d.assignments || [];
    this.d.bests = this.d.bests || {};
    this.d.records = this.d.records || [];
    this.d.settings = this.d.settings || {};
    this.onChange = onChange || function () {};
  }
  var P = MemStore.prototype;
  P._changed = function () { this.onChange(this.d); };

  P.getStudents = function () { return this.d.students.slice(); };
  P.getStudent = function (id) {
    for (var i = 0; i < this.d.students.length; i++) if (this.d.students[i].id === id) return this.d.students[i];
    return null;
  };
  P.updateStudent = function (id, f) {
    var s = this.getStudent(id); if (!s) return;
    for (var k in f) s[k] = f[k];
    this._changed();
  };
  P.addStudent = function (s) { this.d.students.push(s); this._changed(); };

  P.getAssignments = function () { return this.d.assignments.slice(); };
  P.getAssignment = function (id) {
    for (var i = 0; i < this.d.assignments.length; i++) if (this.d.assignments[i].id === id) return this.d.assignments[i];
    return null;
  };
  P.addAssignment = function (a) { this.d.assignments.push(a); this._changed(); };
  P.updateAssignment = function (id, f) {
    var a = this.getAssignment(id); if (!a) return;
    for (var k in f) a[k] = f[k];
    this._changed();
  };
  P.deleteAssignment = function (id) {
    this.d.assignments = this.d.assignments.filter(function (a) { return a.id !== id; });
    this._changed();
  };

  P.getBest = function (sid, aid) { return this.d.bests[sid + '|' + aid] || null; };
  P.setBest = function (sid, aid, f) {
    var k = sid + '|' + aid, b = this.d.bests[k] || { sid: sid, aid: aid };
    for (var x in f) b[x] = f[x];
    this.d.bests[k] = b;
    this._changed();
  };
  P.getAllBests = function () {
    var out = [], b = this.d.bests;
    for (var k in b) out.push(b[k]);
    return out;
  };
  P.getBestsByAssignment = function (aid) {
    return this.getAllBests().filter(function (b) { return b.aid === aid; });
  };

  P.appendRecord = function (r) { this.d.records.push(r); this._changed(); };
  P.getRecordsSince = function (date) {
    return this.d.records.filter(function (r) { return r.date >= date; });
  };

  };

      if (r.flag) out.push(r);

  };
  P.findRecord = function (rid) {
    for (var i = this.d.records.length - 1; i >= 0; i--) {

  P.getTeachers = function () { return (this.d.teachers || []).slice(); };
  P.getTeacher = function (id) {

  // 英文の表示：行ごとに分け、「英語の行」と「日本語だけの行」が隣り合っていれば
  // 入力の順番に関係なく「日本語（上）→ 英語（下）」の組にして表示する
  function passageHTML(tokens, enLine) {
    var lines = [], cur = [];
    tokens.forEach(function (t) {
      if (t.status === 'space' && /\n/.test(t.text)) {
        lines.push(cur); cur = [];
        if ((t.text.match(/\n/g) || []).length >= 2) lines.push(null); // 空行
      } else cur.push(t);
    });
    lines.push(cur);
    function kind(line) {
      if (line === null) return 'blank';
      var words = line.filter(function (t) { return t.status !== 'space'; });
      if (!words.length) return 'blank';
      return words.every(function (t) { return t.status === 'ja'; }) ? 'ja' : 'en';
    }
    function lineHTML(line, cls) {
      if (enLine && cls !== 'ja-line') return '<div class="line' + (cls ? ' ' + cls : '') + '">' + enLine(line) + '</div>';
      return '<div class="line' + (cls ? ' ' + cls : '') + '">' + line.map(function (t) {
        if (t.status === 'space') return ' ';
        var c = ({ ok: ' ok', ng: ' ng', ja: ' ja', phrase: ' phrase', 'phrase-ok': ' phrase ok', 'phrase-ng': ' phrase ng', 'phrase-label': ' phrase-label', blank: ' blank' }[t.status] || '') + (t.blank ? ' was-blank' : '');
        return '<span class="w' + c + '">' + esc(t.text) + '</span>';
      }).join('') + '</div>';
    }
    var html = '', i = 0;
    while (i < lines.length) {
      var k = kind(lines[i]), k2 = i + 1 < lines.length ? kind(lines[i + 1]) : null;
      if ((k === 'en' && k2 === 'ja') || (k === 'ja' && k2 === 'en')) {
        var ja = k === 'ja' ? lines[i] : lines[i + 1], en = k === 'en' ? lines[i] : lines[i + 1];
        html += '<div class="pair">' + lineHTML(ja, 'ja-line') + lineHTML(en) + '</div>';
        i += 2;
      } else {
        html += k === 'blank' ? '<div class="gap"></div>' : lineHTML(lines[i], k === 'ja' ? 'ja-line' : '');
        i += 1;
      }
    }
    return html;
  }
  function plainTokens(text) {
    return Scoring.tokenize(text).map(function (t) { return { text: t.text, status: t.space ? 'space' : t.ja ? 'ja' : 'none', word: !t.space && !t.ja && t.units.length > 0 }; });
  }
  function ringSVG(pct) {
    var r = 64, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
    var color = pct >= 90 ? 'var(--ok)' : pct >= 70 ? 'var(--accent)' : 'var(--ng)';
    return '<svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="' + r + '" fill="none" stroke="#e8ebf1" stroke-width="12"/>' +
      '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>';
  }

  function practiceView(opt) {

    var hasJa = Scoring.tokenize(opt.text).some(function (t) { return t.ja; });
    var jaFixed = type === 4 || type === 5;           // 日本語を常に表示する種類
    var showJaBox = jaFixed && !hasJa && opt.ja;      // 日本語の行がない場合は和訳を表示
    var shuffleCache = {};
    function isEn(t) { return t.word || (t.status !== 'space' && t.status !== 'ja' && !/^phrase/.test(t.status) && t.status !== 'blank' && /[A-Za-z0-9]/.test(t.text)); }
    // ③ スペースとピリオドをなくす
    function noSpace(tokens) {
      var out = [];
      tokens.forEach(function (t, i) {
        if (t.status === 'space' && !/\n/.test(t.text)) {

    function shuffleLine(line) {

      line.forEach(function (t) {
        if (/^phrase/.test(t.status)) {
          if (!seenWord) phraseBefore = true;
          phraseHTML += '<span class="w ' + (t.status === 'phrase-label' ? 'phrase-label' : 'phrase') + '">' + esc(t.text) + '</span> ';
          return;

        if (!t.word) return;
        seenWord = true;
        var w = t.text.replace(/^["“'‘(]+/, '').replace(/[.,!?;:"”’)]+$/, '');

      });

      if (!shuffleCache[key]) {

    if (!Recognizer.isSupported()) micBtn.disabled = true;
    if (settings.saveAudio && AudioCapture.isSupported() && !prefs().captureOff) {
      $('#live').insertAdjacentHTML('beforebegin', '<div class="rec-note">🎙 音読の音声は保存され、先生が聞くことがあります。</div>');
    }

    // 画面を切り替えたら中断（別の画面で音声を流す使い方を防ぐ）
    if (state.visHandler) document.removeEventListener('visibilitychange', state.visHandler);
    state.visHandler = function () {
      if (document.hidden && recording) {
        resetUI();
        if (capture) { capture.cancel(); capture = null; }
        toast('画面を切り替えたため、音読を中断しました。もう一度はじめてください。', true);
      }
    };
    document.addEventListener('visibilitychange', state.visHandler);

    function tick() {
      var sec = Math.floor((Date.now() - startedAt) / 1000);
      timerEl.textContent = Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2);
      if (sec >= 300) stopRec(); // 5分で自動終了
    }
    function previewTokens() {
      if (!phrase) return plainTokens(opt.text);
      return Scoring.phraseTokens(opt.text, phrase, phraseAt).map(function (t) {
        return { text: t.text, status: t.space ? 'space' : t.phraseLabel ? 'phrase-label' : t.phrase ? 'phrase' : t.ja ? 'ja' : 'none',
          word: !t.space && !t.ja && !t.phrase && !t.phraseLabel && t.units.length > 0 };
      });
    }
    async function startRec() {
      if (busy) return;
      Speaker.stop();
      $('#resultArea').innerHTML = '';
      ttsDetected = false;
      // 合言葉（毎回変わる）を英文の途中に入れる
      if (settings.phraseCheck) { phrase = Scoring.makePhrase(opt.text); phraseAt = Scoring.phrasePosition(opt.text); }
      else { phrase = ''; phraseAt = 0; }
      passage.innerHTML = display(previewTokens(), false);
      if (type === 4) passage.classList.add('mode-shuffle');
      if (type === 3) passage.classList.add('mode-nospace');
      if (type === 5) passage.classList.add('mode-trans');
      if (phrase) {
        passage.insertAdjacentHTML('beforebegin', '<div class="phrase-note" id="phraseNote">🔑 のところで、合言葉「<b>' + esc(phrase) + '</b>」も声に出して読んでね</div>');
      }
      // 音声の保存（対応端末のみ）
      capture = null;
      if (settings.saveAudio && AudioCapture.isSupported() && !prefs().captureOff) {
        capture = new AudioCapture();
        try { await capture.start(); } catch (e) { capture = null; }
      }
      var rec = new Recognizer({
        lang: CFG.SPEECH_LANG || 'en-US',
        onUpdate: function (t) { live.textContent = t || '…'; },
        onError: function (m) { toast(m, true); resetUI(); if (capture) { capture.cancel(); capture = null; } }
      });
      state.recognizer = rec;
      try { rec.start(); } catch (e) { toast('音声認識を開始できませんでした：' + e.message, true); if (capture) { capture.cancel(); capture = null; } return; }
      recording = true; startedAt = Date.now();
      $('#bModel').disabled = true;
      // お手本音声（読み上げ）が流れていないか見張る
      clearInterval(ttsTimer);
      ttsTimer = setInterval(function () {
        if (recording && window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending)) ttsDetected = true;
      }, 200);
      micBtn.classList.add('rec'); micBtn.textContent = '⏹'; micBtn.setAttribute('aria-label', '音読をおわる');
      label.textContent = '聞き取り中… 読み終えたら■を押す';
      live.textContent = '…';
      timerId = setInterval(tick, 500); tick();
    }
    function resetUI() {
      recording = false; clearInterval(timerId); clearInterval(ttsTimer);
      micBtn.classList.remove('rec'); micBtn.textContent = '🎤'; micBtn.setAttribute('aria-label', '音読をはじめる');
      label.textContent = 'ボタンを押して音読スタート';
      $('#bModel').disabled = false;
      var pn = $('#phraseNote'); if (pn) pn.remove();
      if (state.recognizer) { state.recognizer.abort(); state.recognizer = null; }
    }
    async function stopRec() {
      if (!recording || busy) return;
      busy = true; recording = false; clearInterval(timerId); clearInterval(ttsTimer);
      var dur = Math.round((Date.now() - startedAt) / 1000);
      micBtn.disabled = true; label.textContent = '判定中…';
      var transcript = await state.recognizer.stop();
      state.recognizer = null;
      var audio = capture ? await capture.stop() : null;
      var hadCapture = !!capture; capture = null;
      $('#bModel').disabled = false;
      var pn = $('#phraseNote'); if (pn) pn.remove();
      live.textContent = transcript || '（聞き取れませんでした）';
      micBtn.classList.remove('rec'); micBtn.textContent = '🎤';
      if (!transcript) {
        if (hadCapture && /iPad|iPhone|iPod/.test(navigator.userAgent + (navigator.maxTouchPoints > 1 ? ' iPad' : ''))) {
          // iPhone・iPad で録音と聞き取りがぶつかった可能性 → この端末では録音をやめる
          setPref('captureOff', true);
          var rn = $('.rec-note'); if (rn) rn.remove();
          label.textContent = '聞き取れませんでした。設定を調整したので、もう一度ためしてね';
        } else {
          label.textContent = '声が聞き取れませんでした。マイクに近づいて、もう一度ためしてね';
        }
        micBtn.disabled = false; busy = false; return;
      }
      // まず端末で判定
      var local = phrase ? Scoring.scoreWithPhrase(opt.text, transcript, phrase, phraseAt) : Scoring.score(opt.text, transcript);
      // はっきりした不正（お手本音声・合言葉なし）はその場で無効にする
      var flag = ttsDetected ? 'tts' : (phrase && local.phrase && local.phrase.matched === 0) ? 'phrase' : '';
      passage.innerHTML = display(local.tokens, true);
      passage.classList.remove('mode-trans', 'mode-shuffle', 'mode-nospace');
      var payload = { aid: opt.aid || '', text: opt.aid ? '' : opt.text, kind: opt.kind, transcript: transcript, duration: dur,
        phrase: phrase, phraseAt: phraseAt, flag: flag, type: type };
      if (audio && settings.saveAudio) payload.audio = audio;
      if (flag) {
        showCheatWarning(flag);
        $('#resultArea').innerHTML = '<div class="card result"><div class="cheat-inline">⚠️ この音読は無効になりました</div>' +
          '<div class="btn-row" style="justify-content:center;margin-top:12px"><button class="btn-primary" id="bAgain">🔁 もう一度読む</button></div></div>';
        $('#bAgain').onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); startRec(); };
        try { await call('submit', payload); } catch (e) { /* 警告の記録に失敗しても続行 */ }
        label.textContent = 'もう一度読むときはボタンを押してね';
        micBtn.disabled = false; busy = false; return;
      }
      showResult(local, null, true);
      try {
        var r = await call('submit', payload);
        passage.innerHTML = display(r.result.tokens, true);
        if (r.flagged && r.definite) {
          showCheatWarning(r.flagged);
          $('#resultArea').innerHTML = '<div class="card result"><div class="cheat-inline">⚠️ この音読は無効になりました</div></div>';
        } else if (r.flagged) {
          // はっきりしない場合：記録を保留し、先生が録音を確認
          $('#resultArea').innerHTML = '<div class="card result pending-card"><div class="pending-title">🔍 先生が確認します</div>' +
            '<p>' + (r.flagged === 'partial' ? '合言葉の一部しか聞き取れませんでした。' : '読む速さがとても速かったため、念のため確認します。') +
            '<br>先生が録音を聞いて、問題がなければ記録されます。</p>' +
            '<div class="btn-row" style="justify-content:center"><button class="btn-primary" id="bAgain2">🔁 もう一度読む</button></div></div>';
          $('#bAgain2').onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); startRec(); };
        } else {
          showResult(r.result, r, false);
          if (opt.aid && (opt.best === null || opt.best === undefined || r.result.accuracy > opt.best)) { opt.best = r.result.accuracy; }
          if (r.progress && opt.onProgress) opt.onProgress(r.progress, r);
          if (state.home) state.home.student = r.student;
        }
      } catch (e) {
        showError(e);
        if ($('#saveState')) $('#saveState').textContent = '⚠️ 記録を保存できませんでした。もう一度ためしてください。';
      }
      label.textContent = 'もう一度読むときはボタンを押してね';
      micBtn.disabled = false; busy = false;
    }
    micBtn.onclick = function () { if (recording) stopRec(); else startRec(); };

    function showResult(r, server, pending) {
      var pct = r.accuracy;
      var cls = pct >= 90 ? 'good' : pct >= 70 ? 'mid' : 'low';
      var msg = pct >= 95 ? 'すばらしい！ほぼ完ぺきです 🎉' : pct >= 85 ? 'とてもよくできました！' : pct >= 70 ? 'いい調子！赤い単語をもう一度練習しよう' : 'お手本を聞いてから、もう一度チャレンジしよう';
      var html = '<div class="card result">';
      html += '<div class="ring">' + ringSVG(pct) + '<div class="center"><div class="big ' + cls + '">' + pct + '<small style="font-size:1.2rem">%</small></div><div class="detail">正確さ</div></div></div>';
      html += '<div class="detail">' + r.correct + ' / ' + r.total + ' 語 読めました</div>';
      html += '<p style="margin-top:8px;font-weight:700">' + msg + '</p>';
      if (server && server.levelUp) html += '<div class="celebrate">🎊 レベルアップ！「' + esc(server.levelUp) + '」になりました！</div>';
      if (server && server.newBest && opt.aid && opt.best !== null && opt.best !== undefined) html += '<div class="celebrate">⭐ 自己ベスト更新！（前回まで ' + opt.best + '%）</div>';
      if (server && opt.aid && (opt.best === null || opt.best === undefined)) html += '<div class="celebrate">🎉 はじめての記録です！</div>';
      if (server && opt.resultExtra) html += opt.resultExtra(server, r);
      html += '<div class="muted" id="saveState">' + (pending ? '記録を保存中…' : '✅ 記録しました（+' + r.correct + '語）') + '</div>';
      html += '<div class="btn-row" style="justify-content:center;margin-top:12px">' +
        '<button class="btn-primary" id="bAgain">🔁 もう一度</button>' +
        (opt.contest && opt.aid ? '<a class="btn" href="#/contest/' + encodeURIComponent(opt.aid) + '">🏆 大会ランキング</a>' : '') +
        '<a class="btn" href="' + (opt.back || '#/home') + '">もどる</a></div>';
      html += '</div>';
      $('#resultArea').innerHTML = html;
      $('#bAgain').onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); startRec(); };
      if (!pending) $('#resultArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  // 練習画面の前に設定（合言葉・音声保存など）を読み込んでおく
  async function ensureHome() {
    if (!state.home) { try { state.home = await call('home'); } catch (e) { /* 既定値で続行 */ } }
  }

  var TYPE_LABEL = { 1: '① 通常', 2: '② 穴埋め', 3: '③ スペースなし', 4: '④ 並べ替え', 5: '⑤ 日本語→英語' };
  // マスターモードで、次に取り組む種類（まだ合格していない最初の種類）
  function nextStep(pg) {
    for (var i = 0; i < pg.types.length; i++) {
      var t = pg.types[i];
      if (pg.bests[t] === null || pg.bests[t] < pg.pass) return t;
    }
    return null;
  }
  function typeHeaderHTML(a, pg, cur) {
    var aid = encodeURIComponent(a.id);
    if (pg.master) {
      var nx = nextStep(pg);
      var html = '<div class="master-head">' + (pg.masterCleared ? '🏆 <b>音読マスター達成！</b>' : '🎓 <b>音読マスターモード</b>：' +
        pg.types.map(function (t) { return '①②③④⑤'.charAt(t - 1); }).join('') + ' をすべて合格（' + pg.pass + '%以上）でクリア') + '</div><div class="steps">';
      pg.types.forEach(function (t, i) {
        var best = pg.bests[t], ok = best !== null && best >= pg.pass;
        var locked = !ok && nx !== null && pg.types.indexOf(nx) < i;
        html += (i ? '<span class="step-arrow">→</span>' : '') +
          (locked ? '<span class="step locked">🔒 ' + TYPE_LABEL[t] + '</span>'
            : '<a class="step' + (ok ? ' ok' : '') + (t === cur ? ' cur' : '') + '" href="#/a/' + aid + '/' + t + '">' + (ok ? '✅ ' : '') + TYPE_LABEL[t] +
              (best !== null ? '<small>' + best + '%</small>' : '') + '</a>');
      });
      return html + '</div>';
    }
    if (pg.types.length < 2) return '';
    return '<div class="steps">' + pg.types.map(function (t) {
      var best = pg.bests[t];
      return '<a class="step' + (t === cur ? ' cur' : '') + '" href="#/a/' + aid + '/' + t + '">' + TYPE_LABEL[t] + (best !== null ? '<small>' + best + '%</small>' : '') + '</a>';
    }).join('') + '</div>';
  }

  // 画像から英文を読み取る（Tesseract.js・端末内で処理）
  async function runOCR(file, ta, statusEl, after) {
    statusEl.textContent = '文字認識の準備中…（初回は少し時間がかかります）';
    try {
      if (!window.Tesseract) await loadFirst(['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js', 'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js']);
      var img = await shrinkImage(file, 2000);
      var worker = await Tesseract.createWorker('eng', 1, {
        logger: function (m) { if (m.status === 'recognizing text') statusEl.textContent = '読み取り中… ' + Math.round(m.progress * 100) + '%'; }
      });
      var res = await worker.recognize(img);
      await worker.terminate();
      var text = cleanOCR(res.data.text);
      if (!text) { statusEl.textContent = '英文が見つかりませんでした。明るい場所で、英文が大きく写るように撮ってください。'; return; }
      ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + text;
      statusEl.textContent = '✅ 読み取りました。まちがいがあれば直してください。';
      after && after();
    } catch (e) {
      statusEl.textContent = '読み取りに失敗しました：' + e.message;
    }
  }
  function shrinkImage(file, max) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        var g = c.getContext('2d');
        g.filter = 'grayscale(1) contrast(1.3)';
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c);
      };
      img.onerror = function () { reject(new Error('画像を開けませんでした')); };
      img.src = url;
    });
  }
  function cleanOCR(t) {
    return String(t || '')
      .replace(/[^\x20-\x7E\n‘’“”]/g, ' ')   // 英数字・記号以外を除去
      .replace(/-\n(?=[a-z])/g, '')                                // 行末ハイフンをつなぐ
      .split(/\n{2,}/).map(function (p) { return p.replace(/\s*\n\s*/g, ' ').replace(/[ \t]+/g, ' ').trim(); })
      .filter(function (p) { return /[A-Za-z]{2,}/.test(p); })
      .join('\n\n').trim();
  }

  // 録音を取得して再生（ボタンを audio 要素に置き換える）
  async function playAudioInto(btn, id) {
    btn.disabled = true; var label = btn.textContent; btn.textContent = '読込中…';
    try {
      var a = await call('t_audio', { id: id });
      var bin = atob(a.b64), arr = new Uint8Array(bin.length);
      for (var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      var url = URL.createObjectURL(new Blob([arr], { type: a.mime }));
      var au = document.createElement('audio');
      au.controls = true; au.src = url; au.className = 'audio-player';
      btn.replaceWith(au); au.play().catch(function () {});
    } catch (e) { showError(e); btn.disabled = false; btn.textContent = label; }
  }

          (x.reviewed ? '<span class="pill ' + (x.reviewed === '自動で無効' ? 'flag' : 'done') + '">' + (x.reviewed === '自動で無効' ? '✗ ' : '✓ ') + esc(x.reviewed) + '</span>'

      '<div class="rp-box"><div class="rp-ja" id="rpJa"></div><div class="rp-en passage" id="rpEn"></div><div class="rp-score" id="rpScore"></div></div>' +
      '<div class="live" id="rpLive"></div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:8px">' + voiceSegHTML() + '<button class="btn-small" id="rpListen">🔊 もう一度聞く</button><button class="btn-small" id="rpRetry">↺ もう一度読む</button><button class="btn-primary" id="rpNext">次へ ▶</button></div>' +
      '<div class="mic-dock"><button class="mic-btn" id="rpMic" aria-label="読む">🎤</button><div class="mic-text"><div class="mic-label" id="rpLabel"></div></div></div></div>' +
      '<div id="rpResult"></div>';
    $app.innerHTML = html;
    var mic = $('#rpMic'), label = $('#rpLabel'), live = $('#rpLive');
    bindVoiceSeg($app);
    function draw() {
      var st = steps[idx];
      $('#rpBar').style.width = Math.round(idx / steps.length * 100) + '%';
      $('#rpCount').textContent = (idx + 1) + ' / ' + steps.length;
      $('#rpJa').textContent = st.ja;
      $('#rpEn').innerHTML = st.phrase ? '<span class="w phrase">🔑 ' + esc(st.en) + '</span>' : spansHTML(plainTokens(st.en));
      $('#rpScore').innerHTML = st.pct === null ? '' : '<b class="' + (st.pct >= 80 ? 'cell-good' : st.pct >= 60 ? 'cell-mid' : 'cell-low') + '">' + st.pct + '%</b>';

    function listen(then) {

      var ok = Speaker.speak(Scoring.englishOnly(st.en) || st.en, prefs().rate, CFG.SPEECH_LANG || 'en-US', ended);

        st.en.split(/\s+/).length * 600 / (prefs().rate || 0.9) + 1500);

    function startRec() {

        onError: function (m) { toast(m, true); stopUI(); } });

      try { rec.start(); } catch (e) { toast('音声認識を開始できませんでした', true); return; }

      clearInterval(ttsTimer);

      mic.classList.add('rec'); mic.textContent = '⏹'; label.textContent = '聞き取り中… 読み終えたら■';

    }
    function stopUI() { recording = false; clearInterval(ttsTimer); mic.classList.remove('rec'); mic.textContent = '🎤'; if (state.recognizer) { state.recognizer.abort(); state.recognizer = null; } }
    async function stopRec() {

      var st = steps[idx];
      if (!t) { label.textContent = '聞き取れませんでした。もう一度🎤を押してね'; return; }

    $('#rpListen').onclick = function () { if (!recording) listen(); };

    $('#rpNext').onclick = function () {

    async function finish() {

        if (r.flagged) {

          '<div class="muted">✅ 記録しました（+' + r.result.correct + '語）</div>' +

  // 画像から英文を読み取る（Tesseract.js・端末内で処理）
  // ---- PDFから英文を読み取る（pdf.js・端末内で処理） ----
  var PDFJS = ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/', 'https://unpkg.com/pdfjs-dist@3.11.174/build/'];
  async function loadPdfJs() {
    if (window.pdfjsLib) return;
    for (var i = 0; i < PDFJS.length; i++) {
      try {
        await loadScript(PDFJS[i] + 'pdf.min.js');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS[i] + 'pdf.worker.min.js';
        return;
      } catch (e) { if (i === PDFJS.length - 1) throw e; }
    }
  }
  function parseRange(str, max) {
    var pages = [];
    String(str || '').split(/[,、\s]+/).forEach(function (part) {
      var m = part.match(/^(\d+)(?:[-~〜ー](\d+))?$/);
      if (!m) return;
      var a = +m[1], b = m[2] ? +m[2] : a;
      for (var p = Math.min(a, b); p <= Math.max(a, b); p++) if (p >= 1 && p <= max && pages.indexOf(p) < 0) pages.push(p);
    });
    return pages;
  }
  // テキストの並び（座標）から行を組み立てる
  function pdfLines(items) {
    var rows = [];
    items.forEach(function (it) {
      if (!it.str || !it.str.trim()) return;
      var y = Math.round(it.transform[5]), x = it.transform[4];
      var row = rows.filter(function (r) { return Math.abs(r.y - y) <= 3; })[0];
      if (!row) { row = { y: y, parts: [] }; rows.push(row); }
      row.parts.push({ x: x, s: it.str });
    });
    rows.sort(function (a, b) { return b.y - a.y; });
    return rows.map(function (r) {
      r.parts.sort(function (a, b) { return a.x - b.x; });
      return joinJa(r.parts.map(function (p) { return p.s; }).join(' '));
    });
  }
  // 日本語の文字どうしの間の空白を詰め、部首の字（⾏ など）をふつうの漢字に直す
  var JA_C = '[\\u3000-\\u30ff\\u3400-\\u9fff\\uff00-\\uffef\\u2e80-\\u2fdf。、「」（）！？]';
  function joinJa(str) {
    var t = String(str).normalize ? String(str).normalize('NFKC') : String(str);
    var re = new RegExp('(' + JA_C + ')\\s+(?=' + JA_C + ')', 'g');
    return t.replace(re, '$1').replace(/\s+/g, ' ').trim();
  }
  // 行を「日本語のまとまり」「英語のまとまり」に整理する
  function tidyPdfText(lines, withJa) {
    var blocks = [];
    lines.forEach(function (l) {
      if (!l) return;
      var ja = Scoring.isJaLine(l);
      if (ja && !withJa) return;
      if (!ja && !/[A-Za-z]{2,}/.test(l)) return;                 // ページ番号などを除く
      var last = blocks[blocks.length - 1];
      if (last && last.ja === ja) {
        if (!ja && /-$/.test(last.text) && /^[a-z]/.test(l)) last.text = last.text.replace(/-$/, '') + l;   // 行末ハイフン
        else last.text += (ja ? '' : ' ') + l;
      } else blocks.push({ ja: ja, text: l });
    });
    return blocks.map(function (b) { return b.text.replace(/\s+/g, ' ').trim(); }).join('\n');
  }
  async function pdfImport(file, ta, box, after) {
    box.innerHTML = '<div class="muted">PDFを読み込んでいます…</div>';
    try {
      await loadPdfJs();
      var pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      var n = pdf.numPages;
      box.innerHTML = '<div class="pdf-box"><b>📄 ' + esc(file.name) + '</b>（全' + n + 'ページ）' +
        '<div class="btn-row" style="margin-top:6px"><label style="margin:0">読み取るページ</label><input type="text" id="pdfPages" value="' + (n <= 2 ? '1-' + n : '1') + '" style="width:120px" placeholder="例：2-3">' +
        '<label class="check" style="margin:0"><input type="checkbox" id="pdfJa">日本語も取り込む</label>' +
        '<button class="btn-primary btn-small" id="pdfGo" type="button">読み取る</button><button class="btn-small" id="pdfCancel" type="button">やめる</button></div>' +
        '<div class="muted" id="pdfStatus" style="margin-top:6px;font-size:.85rem">例：「1」「2-3」「1,3」。教科書などの文字が入ったPDFはそのまま、スキャンした画像のPDFは文字認識で読み取ります（英語のみ）。</div></div>';
      $('#pdfCancel').onclick = function () { box.innerHTML = ''; };
      $('#pdfGo').onclick = async function () {
        var st = $('#pdfStatus'), withJa = $('#pdfJa').checked;
        var pages = parseRange($('#pdfPages').value, n);
        if (!pages.length) { st.textContent = 'ページの指定を確認してください（1〜' + n + '）。'; return; }
        this.disabled = true;
        var out = [], scanned = [];
        for (var i = 0; i < pages.length; i++) {
          st.textContent = pages[i] + 'ページを読み取り中…';
          var page = await pdf.getPage(pages[i]);
          var tc = await page.getTextContent();
          var lines = pdfLines(tc.items);
          var txt = tidyPdfText(lines, withJa);
          if (txt.replace(/\s/g, '').length < 15) scanned.push(page); else out.push(txt);
        }
        // 文字が取れないページ（スキャン画像）は文字認識で読む
        if (scanned.length) {
          if (!window.Tesseract) await loadFirst(['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js', 'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js']);
          var worker = await Tesseract.createWorker('eng');
          for (var k = 0; k < scanned.length; k++) {
            st.textContent = '画像のページを文字認識中…（' + (k + 1) + '/' + scanned.length + '）';
            var vp = scanned[k].getViewport({ scale: 2 });
            var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
            await scanned[k].render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
            var res = await worker.recognize(c);
            var t2 = cleanOCR(res.data.text);
            if (t2) out.push(t2);
          }
          await worker.terminate();
        }
        var text = out.join('\n\n').trim();
        if (!text) { st.textContent = '英文が見つかりませんでした。ページの指定を確認してください。'; this.disabled = false; return; }
        ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + text;
        box.innerHTML = '<div class="muted">✅ PDFから読み取りました。いらない部分を消したり、まちがいを直したりしてください。</div>';
        after && after();
      };
    } catch (e) {
      box.innerHTML = '<div class="error">PDFを読み込めませんでした：' + esc(e.message) + '</div>';
    }
  }

  async function runOCR(file, ta, statusEl, after) {
    statusEl.textContent = '文字認識の準備中…（初回は少し時間がかかります）';
    try {
      if (!window.Tesseract) await loadFirst(['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js', 'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js']);
      var img = await shrinkImage(file, 2000);
      var worker = await Tesseract.createWorker('eng', 1, {
        logger: function (m) { if (m.status === 'recognizing text') statusEl.textContent = '読み取り中… ' + Math.round(m.progress * 100) + '%'; }
      });
      var res = await worker.recognize(img);
      await worker.terminate();
      var text = cleanOCR(res.data.text);
      if (!text) { statusEl.textContent = '英文が見つかりませんでした。明るい場所で、英文が大きく写るように撮ってください。'; return; }
      ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + text;
      statusEl.textContent = '✅ 読み取りました。まちがいがあれば直してください。';
      after && after();
    } catch (e) {
      statusEl.textContent = '読み取りに失敗しました：' + e.message;
    }
  }
  function shrinkImage(file, max) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        var g = c.getContext('2d');
        g.filter = 'grayscale(1) contrast(1.3)';
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c);
      };
      img.onerror = function () { reject(new Error('画像を開けませんでした')); };
      img.src = url;
    });
  }
  function cleanOCR(t) {
    return String(t || '')
      .replace(/[^\x20-\x7E\n‘’“”]/g, ' ')   // 英数字・記号以外を除去
      .replace(/-\n(?=[a-z])/g, '')                                // 行末ハイフンをつなぐ
      .split(/\n{2,}/).map(function (p) { return p.replace(/\s*\n\s*/g, ' ').replace(/[ \t]+/g, ' ').trim(); })
      .filter(function (p) { return /[A-Za-z]{2,}/.test(p); })
      .join('\n\n').trim();
  }

  async function playAudioInto(btn, id) {
    btn.disabled = true; var label = btn.textContent; btn.textContent = '読込中…';

      var a = await call('t_audio', { id: id });
      var bin = atob(a.b64), arr = new Uint8Array(bin.length);

      var au = document.createElement('audio');

  // ---- Excel出力 ----
  async function exportXlsx(rows, name) {
    try {
      if (!window.XLSX) await loadFirst(['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js']);
      var ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = rows[0].map(function (h, i) { return { wch: i === 2 ? 14 : Math.max(8, Math.min(30, String(h).length * 2)) }; });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '成績');
      XLSX.writeFile(wb, name + '.xlsx');
    } catch (e) {
      // 読み込めない場合は CSV（Excelで開けます）
      var csv = '﻿' + rows.map(function (r) { return r.map(function (c) { c = String(c === null || c === undefined ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = name + '.csv'; a.click();
    }
  }

  function customEntry(x) { return x.kind === 'image' ? { c: x.id, t: x.text } : { a: x.animal, t: x.text, col: x.color, po: x.pose, ex: x.expr }; }
  // 画像を小さく整える（スプレッドシートに入る大きさにする）
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();

      };
      if ($('#lbEnd')) $('#lbEnd').onclick = function () { if (confirm('ライブを終了して、表彰しますか？')) endLive(); };
      $('#lbFull').onclick = function () { var el = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); };
      if ($('#lbDel')) $('#lbDel').onclick = async function () {
        if (!confirm('このライブの記録を削除しますか？（生徒に送ったスタンプは消えません）')) return;
        try { await call('t_deleteLive', { id: id }); toast('削除しました'); go('#/t/live'); } catch (e) { showError(e); }
      };
      if (l.status === 'ended') ceremony(); else body();
      tick();
    }
    function body() {
      var l = B.live;
      if (l.status === 'ready') {
        $('#lbBody').innerHTML = '<div class="lb-ready"><div class="big">📣 準備ができました</div><p>生徒に課題「' + esc(l.assignment) + '」を開いてもらい、<b>▶ スタート</b>を押してください。<br>' +
          (l.minutes ? '制限時間は <b>' + l.minutes + '分</b> です。' : '終わるときは <b>■ 終了して表彰</b> を押します。') + '</p></div>';
        return;
      }
      if (!$('#lbList')) $('#lbBody').innerHTML = '<div class="lb-list" id="lbList"></div><div class="lb-empty muted" id="lbEmpty">まだ記録がありません。読み終わった生徒から順に表示されます。</div>';
      rows(B.rows);
    }
    function rowHTML(r) {
      var medal = ['', '🥇', '🥈', '🥉'][r.rank] || '';
      return '<span class="lb-rank">' + (medal || r.rank) + '</span><span class="lb-name"><span class="lb-av">' + avatarHTML(r.av, 52) + '</span>' + esc(r.name) + '</span>' +
        '<span class="lb-sub">' + r.count + '回・最高 ' + r.best + '%</span><span class="lb-pts">' + n(r.points) + '<small>pt</small></span>';
    }
    // 順位が入れ替わるときに、行がすべるように動く
    function rows(list) {
      var box = $('#lbList'); if (!box) return;
      $('#lbEmpty').hidden = !!list.length;
      var first = {}, old = {};
      $all('.lb-row', box).forEach(function (el) { first[el.dataset.sid] = el.getBoundingClientRect().top; old[el.dataset.sid] = el; });
      list.forEach(function (r) {
        var el = old[r.sid] || document.createElement('div');
        var prevP = el.dataset.p;
        el.className = 'lb-row' + (r.rank <= 3 ? ' top' + r.rank : r.rank <= 10 ? ' tten' : '');
        el.dataset.sid = r.sid; el.dataset.p = r.points; el.innerHTML = rowHTML(r);
        if (prevP !== undefined && +prevP !== r.points) { el.classList.add('bump'); setTimeout(function () { el.classList.remove('bump'); }, 900); }
        box.appendChild(el); delete old[r.sid];
      });
      Object.keys(old).forEach(function (k) { old[k].remove(); });
      $all('.lb-row', box).forEach(function (el) {
        var f = first[el.dataset.sid];
        if (f === undefined) { el.classList.add('enter'); return; }
        var dy = f - el.getBoundingClientRect().top;
        if (dy) {
          el.style.transition = 'none'; el.style.transform = 'translateY(' + dy + 'px)';
          requestAnimationFrame(function () { requestAnimationFrame(function () { el.style.transition = 'transform .7s cubic-bezier(.2,.8,.2,1)'; el.style.transform = ''; }); });
        }
      });
      if ($('#lbN')) $('#lbN').textContent = B.total;
    }
    function tick() {
      if (!alive()) return;
      var l = B.live, t = $('#lbTime');
      if (t) {
        if (l.status === 'running' && l.ends) {
          var left = Date.parse(l.ends) - nowMs();
          t.innerHTML = '⏱ のこり <b class="' + (left < 60000 ? 'hurry' : '') + '">' + mmss(left) + '</b>';
          if (left <= 0 && !ending) endLive();
        } else if (l.status === 'running') t.innerHTML = '⏱ <b>' + mmss(nowMs() - Date.parse(l.started)) + '</b>';
        else if (l.status === 'ended') t.innerHTML = '終了 ' + fmtDate(l.ended);
        else t.textContent = '';
      }
      clearTimeout(timer); timer = setTimeout(tick, 500);
    }
    async function poll() {
      if (!alive() || B.live.status !== 'running' || ending) return;
      try { await load(); if (!alive()) return; if (B.live.status === 'running') rows(B.rows); else { frame(); return; } } catch (e) { /* 次の回にまた読む */ }
      setTimeout(poll, 2500);
    }
    async function endLive() {
      if (ending) return; ending = true;
      try { var r = await call('t_endLive', { id: id }); B = r.board; if (alive()) frame(); }
      catch (e) { ending = false; showError(e); }
    }
    // 表彰式
    function ceremony() {
      var res = B.live.results || [];
      var top = [2, 1, 3].map(function (rk) { return res.filter(function (x) { return x.rank === rk; })[0]; });
      var rest = res.filter(function (x) { return x.rank > 3; });
      var html = '<div class="ceremony"><h2 class="cer-title">🎉 結果発表 🎉</h2>';
      if (!res.length) html += '<div class="empty">参加した生徒がいませんでした。</div>';
      html += '<div class="podium">' + top.map(function (x, i) {
        if (!x) return '<div class="pod empty-pod"></div>';
        var delay = [1.6, 2.4, 0.8][i];
        return '<div class="pod pod' + x.rank + '" style="animation-delay:' + delay + 's"><div class="pod-stamp"><span class="pod-av">' + avatarHTML(x.av, x.rank === 1 ? 150 : 110) + '</span><span class="pod-st">' + stampHTML(x.stamp, x.rank === 1 ? 110 : 80) + '</span></div>' +
          '<div class="pod-name">' + esc(x.name) + '</div><div class="pod-pts">' + n(x.points) + '<small>pt</small></div>' +
          '<div class="pod-base">' + ['', '🥇 1位', '🥈 2位', '🥉 3位'][x.rank] + '</div></div>';
      }).join('') + '</div>';
      if (rest.length) html += '<h3 class="cer-sub">🌟 Top 10</h3><div class="top10">' + rest.map(function (x, i) {
        return '<div class="t10" style="animation-delay:' + (3.2 + i * 0.15) + 's"><span class="lb-rank">' + x.rank + '</span>' + avatarHTML(x.av, 50) +
          '<span class="lb-name">' + esc(x.name) + '</span><span class="lb-pts">' + n(x.points) + '<small>pt</small></span></div>';
      }).join('') + '</div>';
      if (res.length) html += '<p class="muted cer-note">表彰された生徒には、特別スタンプを送りました。</p>';
      html += '<div class="btn-row" style="justify-content:center"><button class="btn" id="cerAgain">もう一度見る</button><a class="btn" href="#/t/live">ライブ一覧へ</a></div></div>';
      $('#lbBody').innerHTML = html;
      confetti();
      $('#cerAgain').onclick = function () { ceremony(); };
    }
    function confetti() {
      var box = document.createElement('div'); box.className = 'confetti';
      var cols = ['#ff6b6b', '#ffd43b', '#51cf66', '#339af0', '#f783ac', '#845ef7', '#ff922b'];
      for (var i = 0; i < 90; i++) {
        var p = document.createElement('i');
        p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % cols.length];
        p.style.animationDelay = (Math.random() * 2.5 + 0.5) + 's'; p.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
        p.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
        box.appendChild(p);
      }
      var lb = $('.live-board'); if (lb) lb.appendChild(box);
      setTimeout(function () { box.remove(); }, 8000);
    }
    frame();
    if (B.live.status === 'running') setTimeout(poll, 2500);
  }

  function render() {
    if (state.recognizer) { state.recognizer.abort(); state.recognizer = null; }
    Speaker.stop();
    var ov = document.querySelector('.cheat-overlay'); if (ov) ov.remove();
    var rov = document.querySelector('.reward-overlay'); if (rov) rov.remove();
    $app.classList.remove('wide');
    state.renderSeq = (state.renderSeq || 0) + 1; state.renderAt = Date.now();
    if (!state.keepScroll) window.scrollTo(0, 0);
    state.keepScroll = false;
    var hash = location.hash.replace(/^#/, '') || '/';
    var parts = hash.split('/').filter(Boolean).map(decodeURIComponent);
    state.session = state.session || store(SESSION_KEY);
    topRight();
    var s = state.session;
    if (!s) return viewLogin();
    if (s.role === 'student') {
      switch (parts[0]) {
        case 'a': return viewAssignment(parts[1], parts[2]);
        case 'proverb': return viewProverb();
        case 'free': return viewFree();
        case 'lib': return viewLibrary(parts[1]);
        case 'libitem': return viewLibItem(parts[1]);
        case 'omikuji': return viewOmikuji();
        case 'repeat': return viewRepeat();
        case 'rewards': return viewRewards(parts[1]);
        case 'avatar': return ['new', 'pick', 'make', 'draw', 'photo'].indexOf(parts[1]) >= 0 ? viewAvatarCreate(parts[1]) : viewAvatar(parts[1]);
        case 'settings': return viewStudentSettings();
        case 'rank': return viewRank();
        case 'contest': return viewContest(parts[1]);
        case 'me': return viewMe();
        case 'home': return viewHome();
        default: return go('#/home');
      }
    }
    if (s.role === 'teacher') {
      if (parts[0] !== 't') return go('#/t');
      startFlagWatch();
      switch (parts[1]) {
        case 'new': return viewEdit(null, parts[2]);
        case 'edit': return viewEdit(parts[2]);
        case 'results': return viewResults(parts[2]);
        case 'students': return viewStudents();
        case 'student': return viewStudentDetail(parts[2]);
        case 'import': return viewImport();
        case 'passes': return viewPasses();
        case 'settings': return viewSettings();
        case 'flags': return viewFlags(false);
        case 'admin': return viewAdmin(parts[2]);
        case 'library': return viewTeacherLibrary(parts[2]);
        case 'stamps': return viewStamps(parts[2], parts[3]);
        case 'live': return parts[2] ? viewLiveBoard(parts[2]) : viewLives();
        default: return viewTeacher();
      }
    }
  }

  setTitle();
  try { Speaker.gender = prefs().voice === 'male' ? 'male' : 'female'; } catch (e) { /* noop */ }
  try { var th0 = (store(SESSION_KEY) || {}).role === 'student' ? prefs().theme : 'blue'; document.documentElement.setAttribute('data-theme', th0 || 'blue'); } catch (e) { /* noop */ }
  if (API.isDemo()) document.getElementById('demoBanner').hidden = false;
  window.addEventListener('hashchange', render);
  render();
})();

</script>
</body>
</html>

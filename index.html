          '<label class="check"><input type="checkbox" id="sRank"' + (st.showRanking ? ' checked' : '') + '>生徒にランキングを表示する</label>' +
          '<label class="check"><input type="checkbox" id="sNick"' + (st.allowNick ? ' checked' : '') + '>生徒がニックネームを使えるようにする（ランキングの表示名）</label>' +
          '<h3 style="margin-top:16px">不正防止</h3>' +
          '<label class="check"><input type="checkbox" id="sPhrase"' + (st.phraseCheck ? ' checked' : '') + '>🔑 合言葉チェック（音読の途中に毎回変わる合言葉を読ませる。確認できないと記録しない）</label>' +
          '<label class="check"><input type="checkbox" id="sAudio"' + (st.saveAudio ? ' checked' : '') + '>🎙 音読の音声を保存し、先生画面で再生できるようにする</label>' +
          '<p class="muted" style="font-size:.85rem">お手本音声の検知（判定中にお手本が流れたら記録しない）は常に有効です。音声を保存する場合は、生徒と保護者に事前にお知らせください。</p>' +
          '<div style="margin-top:14px"><button class="btn-primary" id="sSave">保存する</button></div></div>';
      } else {
        html += '<div class="card muted">アプリ全体の設定（アプリ名・ランキング・不正防止など）は、管理者が変更できます。</div>';
      }
      html += '<div class="card"><h2>使い方のヒント</h2><ul>' +
        '<li>生徒には、このページのURLと「パスコード表」を配ってください。</li>' +
        '<li>音声認識は <b>Chrome</b>（PC・Android・Chromebook）と <b>iPhone/iPad の Safari</b> で使えます。</li>' +
        '<li>ホーム画面に追加すると、アプリのように起動できます。</li>' +
        (API.isDemo() ? '' : '<li>データはスプレッドシートに保存されています。直接開いて確認・編集もできます。</li>') + '</ul></div>';
      if (API.isDemo() && m.admin) html += '<div class="card"><h2>デモデータ</h2><p class="muted">デモ用のデータを最初の状態に戻します。</p><button class="btn-danger" id="sReset">デモデータをリセット</button></div>';
      $app.innerHTML = html;
      $('#pSave').onclick = async function () {
        try { await call('t_changePassword', { oldPass: $('#pOld').value, newPass: $('#pNew').value }); $('#pOld').value = ''; $('#pNew').value = ''; toast('パスワードを変更しました'); }
        catch (e) { showError(e); }
      };
      if ($('#sSave')) $('#sSave').onclick = async function () {
        try {
          await call('t_saveSettings', { settings: { appTitle: $('#sTitle').value, showRanking: $('#sRank').checked, allowNick: $('#sNick').checked, phraseCheck: $('#sPhrase').checked, saveAudio: $('#sAudio').checked } });
          state.overview = null; setTitle($('#sTitle').value); toast('保存しました');
        } catch (e) { showError(e); }
      };
      if ($('#sReset')) $('#sReset').onclick = function () {
        if (!confirm('デモデータをリセットしますか？')) return;
        API.resetDemo(); logout(true); toast('リセットしました');
      };
    } catch (e) { $app.innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; }
  }

  // ---- 管理者：先生のアカウントとクラス ----
  async function viewAdmin(editId) {
    bottomNav(); $app.classList.add('wide'); loading();
    try {
      if (!isAdmin()) { $app.innerHTML = teacherTabs('admin') + '<div class="card empty">この画面は管理者だけが使えます。</div>'; return; }
      var tr = await call('t_teachers'), cr = await call('t_classes');
      var classes = cr.classes.map(function (c) { return c.name; });
      var editing = editId === '__new' ? { isNew: true, id: '', name: '', role: 'teacher', classes: [], active: true }
        : tr.teachers.filter(function (t) { return t.id === editId; })[0];
      var html = teacherTabs('admin');
      html += '<div id="pwNotice"></div>';
      // 先生
      html += '<div class="card"><div class="card-title"><h2>👥 先生のアカウント</h2><button class="btn-primary" id="tNew">＋ 先生を追加</button></div>';
      if (editing) {
        html += '<div class="edit-box"><h3>' + (editing.isNew ? '先生を追加' : esc(editing.name) + ' 先生を編集') + '</h3><div class="form-row">' +
          '<div><label for="tfId">ログインID（半角英数字）</label><input type="text" id="tfId" value="' + esc(editing.id) + '"' + (editing.isNew ? '' : ' disabled') + ' autocapitalize="off" placeholder="例：tanaka"></div>' +
          '<div><label for="tfName">名前</label><input type="text" id="tfName" value="' + esc(editing.name) + '" placeholder="例：田中"></div></div>' +
          '<label for="tfRole">役割</label><select id="tfRole" style="width:auto"><option value="teacher"' + (editing.role !== 'admin' ? ' selected' : '') + '>先生（担当クラスに課題を出せる）</option><option value="admin"' + (editing.role === 'admin' ? ' selected' : '') + '>管理者（すべての操作ができる）</option></select>' +
          '<label>担当クラス</label><div class="btn-row">' + (classes.length ? classes.map(function (c) {
            return '<label class="check" style="margin:0 12px 0 0"><input type="checkbox" class="tfCls" value="' + esc(c) + '"' + (editing.classes.indexOf(c) >= 0 ? ' checked' : '') + '>' + esc(c) + '</label>';
          }).join('') : '<span class="muted">先にクラスを登録してください</span>') + '</div>' +
          (editing.isNew ? '' : '<label class="check"><input type="checkbox" id="tfActive"' + (editing.active ? ' checked' : '') + '>このアカウントを有効にする（外すとログインできなくなります）</label>') +
          '<div class="btn-row" style="margin-top:10px"><button class="btn-primary" id="tfSave">' + (editing.isNew ? '追加してパスワードを発行' : '保存する') + '</button><a class="btn" href="#/t/admin">キャンセル</a></div>' +
          '<div class="error" id="tfErr"></div></div>';
      }
      html += '<div class="table-wrap"><table><thead><tr><th>名前</th><th>ログインID</th><th>役割</th><th>担当クラス</th><th>状態</th><th></th></tr></thead><tbody>' +
        tr.teachers.map(function (t) {
          return '<tr><td>' + esc(t.name) + '</td><td>' + esc(t.id) + '</td><td>' + (t.admin ? '<span class="pill admin">管理者</span>' : '先生') + '</td>' +
            '<td>' + esc(t.classes.join('、') || '—') + '</td><td>' + (t.active ? '<span class="pill done">有効</span>' : '<span class="pill gray">無効</span>') + '</td>' +
            '<td><div class="btn-row"><a class="btn btn-small" href="#/t/admin/' + encodeURIComponent(t.id) + '">編集</a>' +
            '<button class="btn-small" data-reset="' + esc(t.id) + '">パスワード再発行</button>' +
            (t.id !== me().id ? '<button class="btn-small btn-danger" data-del="' + esc(t.id) + '">削除</button>' : '') + '</div></td></tr>';
        }).join('') + '</tbody></table></div></div>';
      // クラス
      html += '<div class="card"><h2>🏫 クラスと人数</h2>' +
        '<p class="muted" style="font-size:.88rem">人数を設定すると、出席番号1番から順に生徒が自動で登録され、パスコードも自動で作られます。名前は「生徒」→「名簿の登録」で入れられます（空欄のままでも使えます）。</p>' +
        '<div class="table-wrap"><table><thead><tr><th>クラス</th><th class="num">人数</th><th class="num">登録済み</th><th>担当の先生</th><th></th></tr></thead><tbody>' +
        cr.classes.map(function (c) {
          return '<tr><td><b>' + esc(c.name) + '</b></td><td class="num"><input type="number" class="cCount" data-name="' + esc(c.name) + '" min="0" max="60" value="' + (c.count || c.students) + '" style="width:80px"></td>' +
            '<td class="num">' + c.students + '人</td><td>' + esc(c.teachers.join('、') || '—') + '</td>' +
            '<td><div class="btn-row"><button class="btn-small" data-save="' + esc(c.name) + '">人数を保存</button><button class="btn-small btn-danger" data-delcls="' + esc(c.name) + '">削除</button></div></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<h3 style="margin-top:14px">クラスを追加</h3><div class="btn-row"><input type="text" id="cName" placeholder="例：2B" style="width:120px"><input type="number" id="cNum" min="1" max="60" placeholder="人数" style="width:100px"><button class="btn-primary" id="cAdd">追加</button></div>' +
        '</div>';
      $app.innerHTML = html;

      function showPassword(id, pw) {
        $('#pwNotice').innerHTML = '<div class="card pw-card"><h3>🔑 パスワードを発行しました</h3><p>ログインID：<b>' + esc(id) + '</b>　パスワード：<b class="pw">' + esc(pw) + '</b></p>' +
          '<p class="muted" style="font-size:.88rem">この画面を閉じると、パスワードは二度と表示されません。先生に伝えてください（ログイン後、各自で変更できます）。</p></div>';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      $('#tNew').onclick = function () { go('#/t/admin/__new'); };
      if ($('#tfSave')) $('#tfSave').onclick = async function () {
        $('#tfErr').textContent = '';
        try {
          var data = { isNew: !!editing.isNew, id: editing.isNew ? $('#tfId').value.trim() : editing.id, name: $('#tfName').value.trim(),
            role: $('#tfRole').value, classes: $all('.tfCls').filter(function (c) { return c.checked; }).map(function (c) { return c.value; }).join(','),
            active: $('#tfActive') ? $('#tfActive').checked : true };
          var r = await call('t_saveTeacher', { teacher: data });
          if (data.id === me().id) { state.overview = null; await loadOverview(true); }
          await viewAdmin();
          if (r.password) showPassword(r.id, r.password); else toast('保存しました');
          history.replaceState(null, '', '#/t/admin');
        } catch (e) { $('#tfErr').textContent = e.message; }
      };
      $all('button[data-reset]').forEach(function (b) {
        b.onclick = async function () {
          if (!confirm(b.dataset.reset + ' のパスワードを再発行しますか？（今のパスワードは使えなくなります）')) return;
          try { var r = await call('t_resetTeacherPass', { id: b.dataset.reset }); showPassword(r.id, r.password); } catch (e) { showError(e); }
        };
      });
      $all('button[data-del]').forEach(function (b) {
        b.onclick = async function () {
          if (!confirm(b.dataset.del + ' のアカウントを削除しますか？（その先生が作った課題や記録は残ります）')) return;
          try { await call('t_deleteTeacher', { id: b.dataset.del }); toast('削除しました'); viewAdmin(); } catch (e) { showError(e); }
        };
      });
      async function saveClass(name, count) {
        var r = await call('t_saveClass', { name: name, count: count });
        if (r.needConfirm) {
          if (!confirm('人数を減らすと、次の生徒が名簿から削除されます（音読の記録はスプレッドシートに残ります）。\n\n' + r.removing.join('\n') + '\n\n削除してよろしいですか？')) return false;
          r = await call('t_saveClass', { name: name, count: count, confirm: true });
        }
        state.overview = null;
        toast(name + '：' + (r.added ? r.added + '人を追加' : '') + (r.added && r.removed ? '・' : '') + (r.removed ? r.removed + '人を削除' : '') + (!r.added && !r.removed ? '保存しました' : ''));
        return true;
      }
      $all('button[data-save]').forEach(function (b) {
        b.onclick = async function () {
          var inp = $('.cCount[data-name="' + b.dataset.save + '"]');
          try { if (await saveClass(b.dataset.save, +inp.value)) viewAdmin(); } catch (e) { showError(e); }
        };
      });
      $all('button[data-delcls]').forEach(function (b) {
        b.onclick = async function () {
          var name = b.dataset.delcls;
          try {
            var r = await call('t_deleteClass', { name: name });
            if (r.needConfirm) {
              if (!confirm('クラス「' + name + '」を削除すると、' + r.removing.length + '人の生徒が名簿から削除されます（音読の記録は残ります）。削除してよろしいですか？')) return;
              r = await call('t_deleteClass', { name: name, confirm: true });
            }
            state.overview = null; toast('クラス「' + name + '」を削除しました'); viewAdmin();
          } catch (e) { showError(e); }
        };
      });
      $('#cAdd').onclick = async function () {
        try { if (await saveClass($('#cName').value.trim(), +$('#cNum').value)) viewAdmin(); } catch (e) { showError(e); }
      };
    } catch (e) { $app.innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; }
  }

  // ---- Excel出力 ----
  async function exportXlsx(rows, name) {
    try {
      if (!window.XLSX) await loadFirst(['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js']);
      var ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = rows[0].map(function (h, i) { return { wch: i === 2 ? 14 : Math.max(8, Math.min(30, String(h).length * 2)) }; });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '成績');
      XLSX.writeFile(wb, name + '.xlsx');
    } catch (e) {
      // 読み込めない場合は CSV（Excelで開けます）
      var csv = '﻿' + rows.map(function (r) { return r.map(function (c) { c = String(c === null || c === undefined ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = name + '.csv'; a.click();
    }
  }

  // ================= ルーター =================
  function render() {
    if (state.recognizer) { state.recognizer.abort(); state.recognizer = null; }
    Speaker.stop();
    var ov = document.querySelector('.cheat-overlay'); if (ov) ov.remove();
    $app.classList.remove('wide');
    window.scrollTo(0, 0);
    var hash = location.hash.replace(/^#/, '') || '/';
    var parts = hash.split('/').filter(Boolean).map(decodeURIComponent);
    state.session = state.session || store(SESSION_KEY);
    topRight();
    var s = state.session;
    if (!s) return viewLogin();
    if (s.role === 'student') {
      switch (parts[0]) {
        case 'a': return viewAssignment(parts[1], parts[2]);
        case 'proverb': return viewProverb();
        case 'free': return viewFree();
        case 'rank': return viewRank();
        case 'contest': return viewContest(parts[1]);
        case 'me': return viewMe();
        case 'home': return viewHome();
        default: return go('#/home');
      }
    }
    if (s.role === 'teacher') {
      if (parts[0] !== 't') return go('#/t');
      startFlagWatch();
      switch (parts[1]) {
        case 'new': return viewEdit(null);
        case 'edit': return viewEdit(parts[2]);
        case 'results': return viewResults(parts[2]);
        case 'students': return viewStudents();
        case 'student': return viewStudentDetail(parts[2]);
        case 'import': return viewImport();
        case 'passes': return viewPasses();
        case 'settings': return viewSettings();
        case 'flags': return viewFlags(false);
        case 'admin': return viewAdmin(parts[2]);
        default: return viewTeacher();
      }
    }
  }

  setTitle();
  if (API.isDemo()) document.getElementById('demoBanner').hidden = false;
  window.addEventListener('hashchange', render);
  render();
})();

</script>
</body>
</html>
